name: Manual Deployment (Backend & Frontend)

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  # Backend Deployment (Cloud Run)
  deploy-backend:
    name: Deploy Backend to Cloud Run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud via Workload Identity
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/40946118823/locations/global/workloadIdentityPools/github-workload-identity-pool/providers/github-provider'
          service_account: 'github-deployer@food4kids-473501.iam.gserviceaccount.com'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy backend-service \
            --source ./backend/python \
            --region us-east1 \
            --project food4kids-473501

  # Frontend Deployment (Firebase Hosting)
  deploy-frontend:
    name: Deploy Frontend to Firebase Hosting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Authenticate to Google Cloud via Workload Identity
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/40946118823/locations/global/workloadIdentityPools/github-workload-identity-pool/providers/github-provider'
          service_account: 'github-deployer@food4kids-473501.iam.gserviceaccount.com'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Frontend Production Bundle
        run: |
          cd frontend
          npm run build

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          channelId: live
          projectId: food4kids-473501
          entryPoint: ./frontend
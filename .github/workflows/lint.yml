name: Lint codebase

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  run-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Filter changed files
        uses: dorny/paths-filter@v2
        id: changes
        with:
          filters: |
            frontend:
              - "frontend/**"
            python-backend:
              - "backend/python/**"

      # frontend/emails/html/ is the react-email export; backend/python/app/templates/
      # is the copy Jinja2 actually renders and sends. Both are committed, so they
      # can silently drift (they already had). This needs no toolchain, so it runs
      # whenever either side changes -- before the deps are even installed.
      - name: Check email templates are in sync
        if: steps.changes.outputs.frontend == 'true' || steps.changes.outputs.python-backend == 'true'
        run: ./scripts/sync-email-templates.sh --check

      - name: Set up pnpm
        if: steps.changes.outputs.frontend == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        if: steps.changes.outputs.frontend == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "24.13.0"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install Node.js dependencies
        if: steps.changes.outputs.frontend == 'true'
        run: pnpm install --frozen-lockfile
        working-directory: ./frontend

      - name: Lint frontend
        if: steps.changes.outputs.frontend == 'true'
        working-directory: ./frontend
        run: pnpm lint

      - name: Check frontend formatting
        if: steps.changes.outputs.frontend == 'true'
        working-directory: ./frontend
        run: pnpm format:check

      # Ahead of the build because it runs in seconds rather than minutes, so a
      # broken request contract fails fast.
      - name: Test frontend
        if: steps.changes.outputs.frontend == 'true'
        working-directory: ./frontend
        run: pnpm test

      # `pnpm build` runs `tsc -b && vite build`, so this both type-checks and
      # catches production-build-only failures (vite config, asset imports,
      # build-time env usage) that tsc alone can't see.
      - name: Build frontend
        if: steps.changes.outputs.frontend == 'true'
        working-directory: ./frontend
        run: pnpm build


      - name: Set up Python
        if: steps.changes.outputs.python-backend == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        if: steps.changes.outputs.python-backend == 'true'
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Python dependencies
        if: steps.changes.outputs.python-backend == 'true'
        working-directory: ./backend/python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff linter
        if: steps.changes.outputs.python-backend == 'true'
        working-directory: ./backend/python
        run: ruff check . --config pyproject.toml

      - name: Run Ruff formatter check
        if: steps.changes.outputs.python-backend == 'true'
        working-directory: ./backend/python
        run: ruff format --check . --config pyproject.toml

      - name: Cache mypy cache
        if: steps.changes.outputs.python-backend == 'true'
        uses: actions/cache@v3
        with:
          path: backend/python/.mypy_cache
          key: ${{ runner.os }}-mypy-${{ hashFiles('backend/python/**/*.py') }}
          restore-keys: |
            ${{ runner.os }}-mypy-

      - name: Run MyPy type checker
        if: steps.changes.outputs.python-backend == 'true'
        working-directory: ./backend/python
        run: mypy . --config-file mypy.ini
